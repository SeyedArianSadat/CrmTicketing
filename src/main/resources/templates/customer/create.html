<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="layout/layout :: head('Create Customer')"></head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header">
            <h3>Create Customer</h3>
        </div>

        <div class="card-body">

            <form th:action="@{/customers}"
                  th:object="${customer}"
                  method="post">

                <div class="mb-3">
                    <label class="form-label">Customer Name</label>

                    <input type="text"
                           class="form-control"
                           th:field="*{customerName}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Email</label>

                    <input type="email"
                           class="form-control"
                           th:field="*{email}">
                </div>

                <div class="mb-3">
                    <label class="form-label">Phone</label>

                    <input type="text"
                           class="form-control"
                           th:field="*{phone}">
                </div>

                <div class="mb-3">
                    <label class="form-label">User Id</label>

                    <input type="number"
                           class="form-control"
                           th:field="*{userId}">
                </div>

                <button type="submit"
                        class="btn btn-success">
                    Save
                </button>

                <a th:href="@{/customers}"
                   class="btn btn-secondary">
                    Back
                </a>

            </form>

        </div>

    </div>

</div>

</body>
</html>
