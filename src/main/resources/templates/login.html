<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ورود به سیستم</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<div class="container">
    <div class="login-box">
        <h1>🔐 ورود به سیستم</h1>

        <div id="errorMessage" class="error-message" style="display: none;"></div>

        <div class="input-group">
            <label>👤 نام کاربری</label>
            <input type="text" id="username" placeholder="admin" autocomplete="off">
        </div>

        <div class="input-group">
            <label>🔒 رمز عبور</label>
            <input type="password" id="password" placeholder="••••••••">
        </div>

        <button onclick="login()" class="login-btn">ورود</button>

        <div class="info">
            <p>👨‍💻 اطلاعات تست:</p>
            <code>Username: admin<br>Password: Admin@123</code>
        </div>
    </div>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
