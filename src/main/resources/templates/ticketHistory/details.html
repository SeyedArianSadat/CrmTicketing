<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{layout/layout :: head('Ticket History Details')}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <h2>Ticket History Details</h2>

    <table class="table table-bordered">

        <tbody>

        <tr>
            <th style="width:220px;">ID</th>
            <td th:text="${ticketHistory.ticketHistoryId}">1</td>
        </tr>

        <tr>
            <th>Field Changed</th>
            <td th:text="${ticketHistory.fieldChanged}">status</td>
        </tr>

        <tr>
            <th>Old Value</th>
            <td th:text="${ticketHistory.oldValue}">OPEN</td>
        </tr>

        <tr>
            <th>New Value</th>
            <td th:text="${ticketHistory.newValue}">CLOSED</td>
        </tr>

        <tr>
            <th>Ticket ID</th>
            <td th:text="${ticketHistory.ticketId}">1</td>
        </tr>

        </tbody>

    </table>

    <div class="mt-3">

        <a th:href="@{/ticketHistories}"
           class="btn btn-secondary">
            Back
        </a>

        <a th:href="@{/ticketHistories/edit/{id}(id=${ticketHistory.ticketHistoryId})}"
           class="btn btn-warning">
            Edit
        </a>

        <form th:action="@{/ticketHistories/delete/{id}(id=${ticketHistory.ticketHistoryId})}"
              method="post"
              style="display:inline;">

            <button type="submit"
                    class="btn btn-danger"
                    onclick="return confirm('Delete this ticket history?')">
                Delete
            </button>

        </form>

    </div>

</div>

</body>
</html>
