<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صفحه اصلی | سیستم مدیریت کاربران</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        .hero-section {
            text-align: center;
            padding: 80px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 0 0 50px 50px;
        }

        .hero-section h1 {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .hero-section p {
            font-size: 20px;
            margin-bottom: 40px;
            opacity: 0.9;
        }

        .cards-container {
            max-width: 1200px;
            margin: -50px auto 50px;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        .feature-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .feature-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 50px rgba(0,0,0,0.15);
        }

        .feature-icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        .feature-card h3 {
            color: #333;
            margin-bottom: 15px;
            font-size: 24px;
        }

        .feature-card p {
            color: #666;
            line-height: 1.6;
            margin-bottom: 25px;
        }

        .feature-btn {
            display: inline-block;
            padding: 12px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-weight: bold;
            transition: transform 0.2s;
            border: none;
            cursor: pointer;
        }

        .feature-btn:hover {
            transform: scale(1.05);
        }

        .user-info-card {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
        }

        .status-badge-header {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            margin-top: 10px;
        }

        .status-active-header {
            background: #2ecc71;
            color: white;
        }

        .status-inactive-header {
            background: #e74c3c;
            color: white;
        }

        .guest-message {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
            padding: 15px;
            border-radius: 10px;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .hero-section h1 {
                font-size: 32px;
            }

            .hero-section p {
                font-size: 16px;
            }

            .cards-container {
                margin-top: -30px;
            }
        }
    </style>
</head>
<body>
<div class="hero-section">
    <h1>🚀 سیستم مدیریت کاربران</h1>
    <p>مدیریت کاربران، نقش‌ها و دسترسی‌ها به صورت یکپارچه و امن</p>
</div>

<div class="cards-container" id="cardsContainer">
    <!-- محتوا توسط JavaScript پر می‌شود -->
    <div style="text-align: center; grid-column: 1/-1; padding: 50px;">
        <div class="spinner"></div>
        <p>در حال بارگذاری...</p>
    </div>
</div>

<footer style="text-align: center; padding: 40px; color: white; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); margin-top: 50px;">
    <p>© 2026 سیستم مدیریت کاربران | همه حقوق محفوظ است</p>
</footer>

<script>
    const API_BASE = 'http://localhost:8080/api/v1';
    let authToken = localStorage.getItem('authToken');

    async function loadIndex() {
        if (authToken) {
            await loadUserInfo();
        } else {
            showGuestCards();
        }
    }

    async function loadUserInfo() {
        try {
            const response = await fetch(`${API_BASE}/users/me`, {
                headers: { 'Authorization': `Bearer ${authToken}` }
            });

            const result = await response.json();

            if (result.success && result.data) {
                showUserCards(result.data);
            } else {
                localStorage.removeItem('authToken');
                authToken = null;
                showGuestCards();
            }
        } catch (error) {
            console.error('Error loading user info:', error);
            showGuestCards();
        }
    }

    function showUserCards(user) {
        const container = document.getElementById('cardsContainer');

        container.innerHTML = `
                <div class="feature-card user-info-card">
                    <div class="feature-icon">👤</div>
                    <h3>خوش آمدید، ${escapeHtml(user.fullName || user.username)}!</h3>
                    <div class="status-badge-header ${user.enabled ? 'status-active-header' : 'status-inactive-header'}">
                        ${user.enabled ? '✓ حساب فعال' : '✗ حساب غیرفعال'}
                    </div>
                    <p style="margin-top: 15px;">
                        <strong>نام کاربری:</strong> ${escapeHtml(user.username)}<br>
                        <strong>ایمیل:</strong> ${escapeHtml(user.email)}<br>
                        <strong>نقش‌ها:</strong> ${user.roles.join(', ')}<br>
                        <strong>تأیید ایمیل:</strong> ${user.emailVerified ? '✓ تأیید شده' : '✗ تأیید نشده'}
                    </p>
                    <a href="/dashboard" class="feature-btn">📊 ورود به داشبورد</a>
                </div>

                <div class="feature-card">
                    <div class="feature-icon">👥</div>
                    <h3>مدیریت کاربران</h3>
                    <p>مشاهده، جستجو و مدیریت تمام کاربران سیستم. فعال/غیرفعال کردن حساب‌ها.</p>
                    <a href="/dashboard" class="feature-btn">رفتن به داشبورد</a>
                </div>

                <div class="feature-card">
                    <div class="feature-icon">🔒</div>
                    <h3>امنیت بالا</h3>
                    <p>احراز هویت با JWT، رمزنگاری رمز عبور و مدیریت دسترسی‌های سطح بالا.</p>
                    <button onclick="logout()" class="feature-btn" style="background: #ff4757;">🚪 خروج از حساب</button>
                </div>
            `;
    }

    function showGuestCards() {
        const container = document.getElementById('cardsContainer');

        container.innerHTML = `
                <div class="feature-card">
                    <div class="feature-icon">🔐</div>
                    <h3>ورود به سیستم</h3>
                    <p>وارد حساب کاربری خود شوید و از امکانات سیستم استفاده کنید.</p>
                    <a href="/login" class="feature-btn">ورود</a>
                </div>

                <div class="feature-card">
                    <div class="feature-icon">👥</div>
                    <h3>مدیریت کاربران</h3>
                    <p>مشاهده، جستجو و مدیریت تمام کاربران سیستم. فعال/غیرفعال کردن حساب‌ها.</p>
                    <a href="/login" class="feature-btn">ورود به داشبورد</a>
                </div>

                <div class="feature-card">
                    <div class="feature-icon">🔒</div>
                    <h3>امنیت بالا</h3>
                    <p>احراز هویت با JWT، رمزنگاری رمز عبور و مدیریت دسترسی‌های سطح بالا.</p>
                    <div class="guest-message">
                        <strong>💡 اطلاعات تست:</strong><br>
                        <code>Username: admin<br>Password: Admin@123</code>
                    </div>
                </div>
            `;
    }

    function logout() {
        localStorage.removeItem('authToken');
        window.location.href = '/';
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // بارگذاری صفحه
    document.addEventListener('DOMContentLoaded', loadIndex);
</script>
</body>
</html>
