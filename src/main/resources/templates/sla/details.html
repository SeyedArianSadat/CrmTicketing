<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout/layout :: head('SLA Details')}"></head>

<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">

    <h2>SLA Details</h2>

    <table class="table table-bordered">

        <tr>
            <th>ID</th>
            <td th:text="${sla.slaId}"></td>
        </tr>

        <tr>
            <th>Priority Level</th>
            <td th:text="${sla.priorityLevel}"></td>
        </tr>

        <tr>
            <th>Response Time (Minutes)</th>
            <td th:text="${sla.responseTimeMinutes}"></td>
        </tr>

        <tr>
            <th>Resolution Time (Minutes)</th>
            <td th:text="${sla.resolutionTimeMinutes}"></td>
        </tr>

        <tr>
            <th>Description</th>
            <td th:text="${sla.description}"></td>
        </tr>

    </table>

    <a th:href="@{/slas}" class="btn btn-secondary">
        Back
    </a>

    <a th:href="@{/slas/edit/{id}(id=${sla.slaId})}"
       class="btn btn-warning">
        Edit
    </a>

</div>

</body>
</html>
