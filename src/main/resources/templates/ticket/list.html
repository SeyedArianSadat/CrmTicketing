<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="layout/layout :: head('tickets')"></head>

<body>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Support Agents </h2>

        <a th:href="@{/dashboard}" class="btn btn-outline-primary">

            <i class="bi bi-house-door-fill"></i>

            Dashboard

        </a>

    </div>


    <div class="d-flex justify-content-between mb-4">



        <a th:href="@{/tickets/create}"
           class="btn btn-primary">
            New Ticket
        </a>

    </div>

    <div class="card shadow">

        <div class="card-body">

            <table class="table table-hover align-middle">

                <thead>

                <tr>

                    <th>ID</th>
                    <th>Title</th>
                    <th>Status</th>
                    <th>Priority</th>
                    <th>Department</th>
                    <th>Agent</th>
                    <th></th>

                </tr>

                </thead>

                <tbody>

                <tr th:each="ticket : ${tickets}">

                    <td th:text="${ticket.ticketId}"></td>

                    <td th:text="${ticket.title}"></td>

                    <td>
                        <span class="badge bg-primary"
                              th:text="${ticket.requestStatus}">
                        </span>
                    </td>

                    <td th:text="${ticket.priority}"></td>

                    <td th:text="${ticket.departmentId}"></td>

                    <td th:text="${ticket.agentId}"></td>

                    <td>

                        <a th:href="@{/tickets/{id}(id=${ticket.ticketId})}"
                           class="btn btn-sm btn-outline-primary">
                            View
                        </a>

                        <a th:href="@{/tickets/edit/{id}(id=${ticket.ticketId})}"
                           class="btn btn-sm btn-warning">
                            Edit
                        </a>

                        <a th:href="@{/tickets/delete/{id}(id=${ticket.ticketId})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Delete this ticket?')">
                            Delete
                        </a>

                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

</div>

</body>

</html>
