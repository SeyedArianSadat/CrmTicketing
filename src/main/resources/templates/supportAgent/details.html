<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="layout/layout :: head('Agent Details')"></head>

<body>

<div class="container mt-5">

    <div class="card shadow">

        <div class="card-header">

            <h3>Agent Details</h3>

        </div>

        <div class="card-body">

            <table class="table">

                <tr>

                    <th>ID</th>

                    <td th:text="${agent.agentId}"></td>

                </tr>

                <tr>

                    <th>Name</th>

                    <td th:text="${agent.agentName}"></td>

                </tr>

                <tr>

                    <th>User Id</th>

                    <td th:text="${agent.userId}"></td>

                </tr>

                <tr>

                    <th>Department Id</th>

                    <td th:text="${agent.departmentId}"></td>

                </tr>

            </table>

            <a th:href="@{/agents}"
               class="btn btn-secondary">
                Back
            </a>

        </div>

    </div>

</div>

</body>

</html>
