<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="layout/layout :: head('Edit Support Agent')"></head>

<body>

<div class="container mt-5">
  <div class="d-flex justify-content-between align-items-center mb-4">

    <h2>Support Agents </h2>

    <a th:href="@{/dashboard}" class="btn btn-outline-primary">

      <i class="bi bi-house-door-fill"></i>

      Dashboard

    </a>

  </div>

  <div class="card shadow">

    <div class="card-header">

      <h3>Edit Support Agent</h3>

    </div>

    <div class="card-body">

      <form th:action="@{/agents/edit/{id}(id=${agent.agentId})}"
            th:object="${agent}"
            method="post">

        <input class="form-control" th:field="*{agentName}">

        <input class="form-control" type="number" th:field="*{userId}">

        <input class="form-control" type="number" th:field="*{departmentId}">

        <button class="btn btn-warning">Update</button>

      </form>

    </div>

  </div>

</div>

</body>

</html>
