<form th:action="@{/ui/customers}" method="post">

    <div class="mb-3">
        <label>Name</label>
        <input class="form-control"
               th:field="*{customerName}">
    </div>

    <div class="mb-3">
        <label>Email</label>
        <input class="form-control"
               th:field="*{email}">
    </div>

    <div class="mb-3">
        <label>Phone</label>
        <input class="form-control"
               th:field="*{phone}">
    </div>

    <button class="btn btn-primary">
        Save
    </button>

</form>
