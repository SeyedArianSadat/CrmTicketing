<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="layout/layout :: head('Departments')"></head>

<body>

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">

        <h2>Departments </h2>

        <a th:href="@{/dashboard}" class="btn btn-outline-primary">

            <i class="bi bi-house-door-fill"></i>

            Dashboard

        </a>

    </div>


    <div class="card shadow">

        <div class="card-header">

            <h3>Create Department</h3>

        </div>

        <div class="card-body">

            <form th:action="@{/departments/edit/{id}(id=${department.departmentId})}"
                  th:object="${department}"
                  method="post">

                <div class="mb-3">

                    <label>Name</label>

                    <input
                            type="text"
                            class="form-control"
                            th:field="*{departmentName}">

                </div>

                <button class="btn btn-warning">
                    Update
                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
